services:
  minio:
    # Last official release digest, retained for M6. Upstream withdrew public
    # images from Docker Hub and Quay in September 2026; see PR limitations.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: keelhaul-test
      MINIO_ROOT_PASSWORD: keelhaul-test-password
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
  sshd:
    image: lscr.io/linuxserver/openssh-server:version-10.2_p1-r0@sha256:67d4c3a1402179a6579aa217a38b52ced557eb8a0c17a8e32fe986a4549fdee4
    environment:
      USER_NAME: keelhaul
      PUBLIC_KEY_FILE: /scratch/authorized_keys
      PASSWORD_ACCESS: 'false'
      SUDO_ACCESS: 'false'
    ports:
      - '127.0.0.1:2222:2222'
    volumes:
      # M7 creates .tmp/sshd/authorized_keys from a scratch test key.
      - ./.tmp/sshd:/scratch:ro
      - sshd-config:/config
volumes:
  minio-data:
  sshd-config:
