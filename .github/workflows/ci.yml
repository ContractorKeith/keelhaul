name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  accept:
    name: accept (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/accept.sh
