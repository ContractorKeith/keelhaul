[package]
name = "keelhaul"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A deduplicating, encrypted backup CLI"

[features]
default = []
fault-injection = []

[dependencies]
globset = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
rusty-s3 = "0.11.0"
instant-xml = "0.7.7"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

blake3 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zstd = "0.13"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
rpassword = "7"
gethostname = "1"
uzers = "0.12"
shell-words = "1.1.1"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
proptest = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
