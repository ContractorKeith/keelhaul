[package]
name = "keelhaul"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A deduplicating, encrypted backup CLI"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
